version: '3.8'

services:
  coupon-service:
    build: ./coupon-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      retries: 3

  payment-service:
    build: ./payment-service
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      COUPON_SERVICE_BASE_URL: http://coupon-service:8081
    depends_on:
      coupon-service:
        condition: service_healthy
