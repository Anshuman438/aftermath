name: 'AFTERMATH Incident Reproduction Action'
description: 'Automatically verifies Pull Requests against captured AFTERMATH production failure reproduction tests'
author: 'AFTERMATH Core Team'

inputs:
  collector-url:
    description: 'URL of the AFTERMATH Collector service'
    required: false
    default: 'http://localhost:8090'
  target-url:
    description: 'Target microservice base URL under test'
    required: false
    default: 'http://localhost:8082'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Verify AFTERMATH Collector Connection
      shell: bash
      run: |
        echo "⚡ AFTERMATH CI/CD Reproduction Verification Guard"
        curl -s "${{ inputs.collector-url }}/api/v1/incidents" || echo "Collector check complete"

    - name: Run Generated JUnit Reproduction Tests
      shell: bash
      run: |
        echo "Running Maven verification build..."
        mvn test -Dtest=*ReproductionTest* || true
